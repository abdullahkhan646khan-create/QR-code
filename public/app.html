<div class="shell">
  <aside class="side" aria-label="Main">
    <div class="brand">
      <div class="brand-mark"><svg class="i"><use href="#i-qr"/></svg></div>
      <div style="min-width:0"><div class="brand-name">Trainer Pass</div><div class="brand-gym" data-gym>…</div></div>
    </div>
    <nav class="nav" id="side-nav"></nav>
    <div class="side-user">
      <div class="avatar" id="me-avatar"></div>
      <div class="who"><strong id="me-name"></strong><span id="me-role"></span></div>
      <button class="icon-btn" type="button" data-action="logout" aria-label="Log out" title="Log out"><svg class="i"><use href="#i-logout"/></svg></button>
    </div>
  </aside>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg class="i"><use href="#i-qr"/></svg></div>
      <div style="min-width:0"><div class="brand-name">Trainer Pass</div><div class="brand-gym" data-gym>…</div></div>
    </div>
    <div style="display:flex;gap:2px">
      <button class="icon-btn" type="button" data-go="settings" id="top-settings" aria-label="Settings" hidden><svg class="i"><use href="#i-gear"/></svg></button>
      <button class="icon-btn" type="button" data-action="logout" aria-label="Log out"><svg class="i"><use href="#i-logout"/></svg></button>
    </div>
  </header>

  <main class="main" id="main">
    <div class="view"><div class="empty">Loading…</div></div>
  </main>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>
</div>

<div class="modal" id="modal" hidden>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-btn" type="button" data-action="close" aria-label="Close"><svg class="i"><use href="#i-close"/></svg></button></div>
    <div class="dialog-body" id="dialog-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/vendor/jsQR.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
