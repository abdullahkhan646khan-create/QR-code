# Render Blueprint: one web service + one free Postgres database.
# Render > New > Blueprint > pick this repo. You'll be asked for ADMIN_PASSWORD.
services:
  - type: web
    name: trainer-pass
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: trainer-pass-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: owner
      - key: ADMIN_PASSWORD
        sync: false
      - key: GYM_NAME
        value: Demo Fitness Club
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: DEFAULT_COUNTRY_CODE
        value: "92"
      - key: SEED_DEMO
        value: "true"

databases:
  - name: trainer-pass-db
    plan: free
    region: singapore
    databaseName: trainer_pass
    user: trainer_pass
