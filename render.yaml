# Render Blueprint: one web service. Data is stored in Supabase.
# Render > New > Blueprint > pick this repo. You'll be asked for SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY and ADMIN_PASSWORD.
services:
  - type: web
    name: trainer-pass
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: owner
      - key: ADMIN_PASSWORD
        sync: false
      - key: GYM_NAME
        value: Demo Fitness Club
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: DEFAULT_COUNTRY_CODE
        value: "92"
      - key: SEED_DEMO
        value: "true"
